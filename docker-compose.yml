services:
  caddy:
    image: docker.m.daocloud.io/caddy:2-alpine
    container_name: caddy2
    restart: unless-stopped
    ports:
      - "81:80"
      - "443:443"
      - "443:443/udp" #后续测http3/quic保留
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # 容器内只读
      - ./data/caddy:/data
      - ./conf/caddy_config:/config
      - ./certs:/certs:ro
    depends_on:
      fall_chat_backend:
        condition: service_started

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - ./store:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mysql8:
    image: docker.m.daocloud.io/library/mysql:8.0.40
    container_name: mysql8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fallchat
      MYSQL_USER: fc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s #30s启动缓冲时间
    ports:
      - "13306:3306"
    volumes:
      - ./data/db:/var/lib/mysql
      - ./conf:/etc/mysql/conf.d
      - ./logs/db:/var/log/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # redis服务
  redis8:
    image: docker.m.daocloud.io/library/redis:8
    container_name: redis8
    restart: unless-stopped
    ports: 
      - "6378:6379"
    volumes: 
      - ./data/redis:/data
    command: redis-server --appendonly yes --requirepass 12345678
    healthcheck:
      test: ["CMD", "redis-cli","-a","12345678","ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # kafka(kraft模式)
  kafka39:
    image: docker.m.daocloud.io/apache/kafka:3.9.0
    container_name: kafka39
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # kraft 配置
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "fall-chat-kafka-cluster-id"
      KAFKA_PROCESS_ROLES: broker,controller 
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 监听器配置
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 单机模式必需的副本因子配置
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ./data/kafka:/var/lib/kafka/data

  #go 后端服务
  fall_chat_backend:
    build: ./backend
    container_name: fall_chat_backend
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DB_HOST: mysql8
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: fallchat
      STMP_HOST: ${STMP_HOST}
      STMP_PORT: ${STMP_PORT}
      STMP_USER: ${STMP_USER}
      STMP_PASS: ${STMP_PASSWORD}
      MINIO_BUCKETNAME: ${MINIO_BUCKETNAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESSKEYID: ${MINIO_ACCESSKEYID}
      MINIO_SECRETACCESSKEY: ${MINIO_SECRETACCESSKEY}
      MINIO_USESSL: ${MINIO_USESSL}
      KAFKA_BROKER: ${KAFKA_BROKER}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASS: ${REDIS_PASS}
      REDIS_DB: ${REDIS_DB}
      REDIS_PROTOCOL: ${REDIS_PROTOCOL}
      GRPC_PORT: ${GRPC_PORT}
      HOST_IP4: ${HOST_IP4}

    depends_on:
      mysql8:
        condition: service_healthy
      redis8:
        condition: service_healthy
      kafka39:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./logs/backend:/app/logs

  #fsql:
  #  build: ./fsql
  #  container_name: fsql
  #  depends_on:
  #    mysql8:
  #      condition: service_healthy
  #    fall_chat_backend: 
  #      condition: service_started
  #  volumes:
  #    - ./fsql:/app

  #vue3 前端服务
  fall_chat_frontend:
    build: ./frontend
    container_name: fall_chat_frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
